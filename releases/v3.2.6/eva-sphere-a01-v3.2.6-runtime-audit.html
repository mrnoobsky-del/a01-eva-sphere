  setMetricLines([`5 уровней · ${OBJECT_REGISTRY.length} пространств`,`Секторы: ${fmtArea(modules)} · галереи: ${fmtArea(walk)}`,`Масштаб: ${C.metersPerUnit?'привязан':'не откалиброван'}`]);
  return;
 }
 const q=calculateLevel(i),lines=[`L0${i}: ${fmtArea(q.modulesArea)} — геометрическая площадь зон`,`Галерея: ${fmtArea(q.walkArea)} · ${q.sectors} зон`,`Глубина зоны: ${fmtNumber(q.moduleDepth)} ед.`];
 if(i===4){const base=originalEllipseCrownDepth();if(Number.isFinite(base)&&base>0)lines.push(`Верхняя корона: +${fmtNumber((q.moduleDepth/base-1)*100)}% глубины к исходному профилю`);}
 setMetricLines(lines);
}
function selectSector(m){
 clearSel();if(!m)return;selMesh=m;selMesh.material.emissiveIntensity=.55;selMesh.material.opacity=.38;
 const {level,sector}=m.userData,room=OBJECT_REGISTRY.find(x=>x.level===level&&x.sector===sector+1);
 $('info-title').textContent=`${room.id} · ${room.name.toUpperCase()}`;
 $('info-subtitle').textContent=KIND_INFO[room.kind];
 setMetricLines([`Площадь сектора: ${fmtArea(room.area)}`,`Тип: ${room.kind}`,'Путь: портал → галерея → центральный узел','Статус: концепция']);
 $('info-status').textContent='ГЕОМЕТРИЧЕСКАЯ ОЦЕНКА · НЕ ОБМЕР';
}
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6){down=null;return;}down=null;const r=renderer.domElement.getBoundingClientRect();ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);const hit=ray.intersectObjects(sectorMeshes.filter(m=>m.parent.visible),false)[0];if(hit)selectSector(hit.object);else focusLevel(focus);});
focusLevel(null);
renderAudit();
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.fov=w<h?Math.min(85,2*Math.atan(Math.tan(21*Math.PI/180)/(w/h))*180/Math.PI*.9):42;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize,{passive:true});resize();

let last=performance.now(),rafId=0,animationStopped=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(rafId);}else if(!animationStopped){last=performance.now();rafId=requestAnimationFrame(animate);}});
renderer.domElement.addEventListener('webglcontextlost',event=>{event.preventDefault();animationStopped=true;cancelAnimationFrame(rafId);showSceneError('Потерян графический контекст WebGL',new Error('Браузер остановил 3D-контекст. Перезагрузите страницу или уменьшите нагрузку.'));});
function animate(now){
 if(document.hidden||animationStopped)return;
 rafId=requestAnimationFrame(animate);
 try{
  const dt=Math.min((now-last)/1000,.05);last=now;
  explode+=(explodeTarget-explode)*Math.min(1,dt*4);
  dome.visible=domeOn&&explode<.04;
  levelGroups.forEach((g,i)=>{g.position.y=g.userData.baseY+i*EXPLODE_STEP*explode;});
  verticalCirculation.visible=circulationOn&&explode<.04;
  const activeStop=focus===null?0:focus,targetLiftY=levels[activeStop].y;
  liftCars.forEach(car=>{car.group.position.y+=(targetLiftY-car.group.position.y)*Math.min(1,dt*2.5);});
  landingDoors.forEach(door=>{const car=liftCars.find(item=>item.id===door.lift),atStop=car&&Math.abs(car.group.position.y-levels[door.level].y)<.055,open=atStop&&door.level===activeStop,shift=open?door.shift:0;door.panels[0].position.x=door.closed[0]-shift;door.panels[1].position.x=door.closed[1]+shift;});
  const ty=focus===null?4.5+2*EXPLODE_STEP*explode:levelCenterY(focus);
  controls.target.y+=(ty-controls.target.y)*Math.min(1,dt*3);
  controls.update();renderer.render(scene,camera);
 }catch(error){animationStopped=true;cancelAnimationFrame(rafId);showSceneError('Ошибка во время 3D-рендеринга',error);}
}
rafId=requestAnimationFrame(animate);
window.EVA_SPHERE={sectorMeshes,selectSector,PROGRAM,THREE,CONFIG,scene,camera,controls,levelGroups,focusLevel,setExplode,outerAt,volH,domeRadiusAtY,sectorsForLevel,originalEllipseCrownDepth,OBJECT_REGISTRY,calculateLevel,calcSectorArea,geometryAudit,routeAudit,renderAudit,roomPortals,externalPortals,galleryBridges,stairConnections,liftStops,liftCars,verticalCirculation};
}catch(err){
 showSceneError('Не удалось запустить 3D',err);
}
</script>
