<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Визуальная система Сферы Евы</title><rect width="1600" height="900" fill="#000"/><g fill="#fff" font-family="Inter,Manrope,Arial,sans-serif"><text x="100" y="125" font-size="26" letter-spacing="8">СФЕРА ЕВЫ / BRAND SYSTEM 01</text><text x="100" y="240" font-size="72" font-weight="600">Сначала смысл.</text><text x="100" y="325" font-size="72" font-weight="600">Затем пространство.</text><text x="100" y="400" font-size="25" fill="#777">Сдержанная айдентика оставляет место реальной жизни внутри Сферы.</text><text x="100" y="525" font-size="22" letter-spacing="4">БАЗОВАЯ ПАЛИТРА</text><text x="100" y="735" font-size="24">#000000</text><text x="355" y="735" font-size="24">#111111</text><text x="610" y="735" font-size="24">#FFFFFF</text><text x="865" y="735" font-size="24">#777777</text><text x="1120" y="735" font-size="24">#E6E6E6</text><text x="100" y="820" font-size="22" fill="#777">Свободное пространство · ясная иерархия · читаемая кириллица · никакой декоративной перегрузки</text></g><g><rect x="100" y="565" width="210" height="120" rx="10" fill="#000" stroke="#777"/><rect x="355" y="565" width="210" height="120" rx="10" fill="#111"/><rect x="610" y="565" width="210" height="120" rx="10" fill="#fff"/><rect x="865" y="565" width="210" height="120" rx="10" fill="#777"/><rect x="1120" y="565" width="210" height="120" rx="10" fill="#E6E6E6"/></g></svg>