<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <style>
      .t{font:600 25px Arial,sans-serif;fill:#f9fafb}
      .s{font:18px Arial,sans-serif;fill:#d1d5db}
      .k{font:600 17px Arial,sans-serif;fill:#111827}
      .w{font:600 18px Arial,sans-serif;fill:#f9fafb}
      .line{stroke:#38bdf8;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .pipe{stroke:#f97316;stroke-width:9;fill:none;stroke-linecap:round}
      .panel{fill:#263244;stroke:#475569;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="60" y="62" class="t" font-size="34">A-01 · EVA SnowFlow</text>
  <text x="60" y="96" class="s">Концептуальная схема зимней поверхности · не в масштабе · не рабочий чертёж</text>

  <rect x="50" y="130" width="1300" height="320" rx="22" class="panel"/>
  <text x="82" y="174" class="t">01 · План: чистая полоса и боковые элементы</text>
  <rect x="95" y="205" width="980" height="165" rx="10" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="110" y="220" width="950" height="135" rx="6" fill="#475569"/>
  <line x1="130" y1="287" x2="1035" y2="287" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="22 18" opacity=".75"/>
  <text x="390" y="270" class="w">Основная полоса движения</text>
  <text x="395" y="310" class="s">ровная · без выступающих скосов</text>
  <rect x="95" y="380" width="980" height="35" rx="8" fill="#0f766e"/>
  <path d="M150 390 l30 15 l30 -15 l30 15 l30 -15 l30 15 l30 -15 l30 15 l30 -15 l30 15 l30 -15 l30 15 l30 -15 l30 15 l30 -15 l30 15 l30 -15 l30 15 l30 -15 l30 15" stroke="#99f6e4" stroke-width="4" fill="none"/>
  <text x="125" y="440" class="s">Боковая экспериментальная полоса G1/G2 · сбор воды → лоток</text>
  <rect x="1100" y="205" width="210" height="210" rx="12" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <path d="M1130 250 q60 -50 120 0 M1130 280 q60 -50 120 0 M1130 310 q60 -50 120 0" stroke="#38bdf8" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="1122" y="350" class="w">Дефлектор</text>
  <text x="1122" y="378" class="s">только вне маршрута</text>

  <rect x="50" y="480" width="850" height="360" rx="22" class="panel"/>
  <text x="82" y="524" class="t">02 · Поперечный разрез поверхности</text>
  <rect x="100" y="585" width="720" height="48" rx="5" fill="url(#slab)"/>
  <text x="120" y="616" class="k">Верхний слой: сцепление, износ, плавный поперечный уклон</text>
  <rect x="100" y="635" width="720" height="70" fill="#64748b"/>
  <path d="M160 668 C190 628 220 628 250 668 S310 708 340 668 S400 628 430 668 S490 708 520 668 S580 628 610 668 S670 708 700 668 S760 628 790 668" class="pipe"/>
  <text x="122" y="697" class="w">Теплообменные трубы / кабели — по расчёту</text>
  <rect x="100" y="707" width="720" height="78" fill="#334155"/>
  <text x="120" y="754" class="w">Основание · изоляция · влагозащита · несущая конструкция</text>
  <path d="M820 610 L860 650 L860 730" class="line"/>
  <rect x="842" y="730" width="35" height="55" rx="4" fill="#0f766e"/>
  <text x="610" y="814" class="s">Сборный лоток с доступом для очистки</text>

  <rect x="930" y="480" width="420" height="360" rx="22" class="panel"/>
  <text x="962" y="524" class="t">03 · Цикл управления</text>
  <rect x="980" y="555" width="320" height="48" rx="10" fill="#0f766e"/>
  <text x="1000" y="586" class="w">Датчики + прогноз</text>
  <path d="M1140 604 V636" class="line"/>
  <rect x="980" y="642" width="320" height="48" rx="10" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <text x="1000" y="673" class="w">Локальный контроллер</text>
  <path d="M1140 691 V723" class="line"/>
  <rect x="980" y="729" width="320" height="48" rx="10" fill="#7c2d12"/>
  <text x="1000" y="760" class="w">Подогрев + водоотвод</text>
  <text x="980" y="811" class="s">Ева: мониторинг и рекомендации</text>
</svg>