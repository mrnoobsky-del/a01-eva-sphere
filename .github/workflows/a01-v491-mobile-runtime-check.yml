name: A-01 v4.9.1 mobile runtime checks
on:
  push:
    branches:
      - preview/v491-mobile-performance-hardening
    paths:
      - 'digital-twin/eva-sphere-a01-v491-mobile-*.html'
      - 'performance/V491-MOBILE-RUNTIME-HARDENING_RU.md'
      - '.github/workflows/a01-v491-mobile-runtime-check.yml'
  pull_request:
    paths:
      - 'digital-twin/eva-sphere-a01-v491-mobile-*.html'
      - 'performance/V491-MOBILE-RUNTIME-HARDENING_RU.md'
      - '.github/workflows/a01-v491-mobile-runtime-check.yml'
  workflow_dispatch:
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract scripts and validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('digital-twin/eva-sphere-a01-v491-mobile-runtime-preview.html')
          html = path.read_text(encoding='utf-8')
          scripts = re.findall(r"""<script\b([^>]*)>([\s\S]*?)</script>""", html, re.I)
          module = next((code for attrs, code in scripts if re.search(r"""type=["']module["']""", attrs, re.I)), None)
          if module is None:
              raise SystemExit('Three.js module was not found')
          Path('/tmp/a01-v491-runtime.mjs').write_text(module, encoding='utf-8')
          for index, (attrs, code) in enumerate(scripts):
              if re.search(r"""type=["'](?:module|importmap|application/ld\+json)["']""", attrs, re.I):
                  continue
              Path(f'/tmp/a01-v491-inline-{index}.js').write_text(code, encoding='utf-8')
          ids = re.findall(r"""\bid=["']([^"']+)["']""", html)
          duplicates = sorted({value for value in ids if ids.count(value) > 1})
          if duplicates:
              raise SystemExit('Duplicate HTML IDs: ' + ', '.join(duplicates[:30]))
          for marker in ['DOLEK_LOD_REFRESH_MS = isMobilePerformance ? 125 : 75',
                         'WALK_GAZE_REFRESH_MS = isMobilePerformance ? 220 : 125',
                         'A01_TARGET_FPS = 60',
                         'updateDolekLod(true)']:
              if marker not in module:
                  raise SystemExit('Missing runtime marker: ' + marker)
          if '4.9.1-mobile-runtime-hardening' not in html:
              raise SystemExit('Version metadata mismatch')
          print(f'HTML IDs: {len(ids)} unique; script blocks: {len(scripts)}')
          PY
          node --check /tmp/a01-v491-runtime.mjs
          for file in /tmp/a01-v491-inline-*.js; do node --check "$file"; done
      - name: Validate mobile study shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('digital-twin/eva-sphere-a01-v491-mobile-study-preview.html')
          html = path.read_text(encoding='utf-8')
          ids = re.findall(r"""\bid=["']([^"']+)["']""", html)
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate IDs in mobile study shell')
          scripts = re.findall(r"""<script\b[^>]*>([\s\S]*?)</script>""", html, re.I)
          for index, code in enumerate(scripts):
              Path(f'/tmp/a01-v491-study-{index}.js').write_text(code, encoding='utf-8')
          for marker in ['data-section="levels"', 'data-section="climate"', 'Замер 60 с', 'frameIntervalMs', 'renderer.render']:
              if marker not in html:
                  raise SystemExit('Missing mobile shell feature: ' + marker)
          print(f'Mobile shell IDs: {len(ids)} unique')
          PY
          for file in /tmp/a01-v491-study-*.js; do node --check "$file"; done
      - name: Upload preview HTML files for Wix deployment
        uses: actions/upload-artifact@v4
        with:
          name: a01-v491-mobile-preview-files
          path: |
            digital-twin/eva-sphere-a01-v491-mobile-runtime-preview.html
            digital-twin/eva-sphere-a01-v491-mobile-study-preview.html
          if-no-files-found: error
          retention-days: 7
