<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f0">
<title>A-01 Living World v0.1.1 — Preview</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  }
}
</script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.45 Inter,system-ui,sans-serif;background:#edf1ef;color:#17232a}body{overflow:hidden}.shell{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:#fbfcfb;border-bottom:1px solid #dbe2df}header strong{display:block;font-size:13px;letter-spacing:.12em}header span{color:#6a797c;font-size:10px}.tag{padding:7px 10px;border:1px solid #d1dcd8;border-radius:999px;font-size:9px;color:#53676d}.stage{position:relative;min-height:0;background:radial-gradient(ellipse at 50% 50%,#19364b 0,#0d1c2b 55%,#060d16 100%)}#previewStage{position:absolute;inset:0}#previewStage canvas{display:block;width:100%;height:100%;touch-action:none}.help{position:absolute;left:16px;bottom:16px;z-index:5;max-width:280px;padding:10px 12px;border:1px solid #ffffff26;border-radius:12px;background:#081522cf;color:#e8f1f2;font-size:10px;pointer-events:none}@media(max-width:600px){header{padding:11px 13px}header strong{font-size:11px}.help{left:10px;bottom:10px;max-width:210px;font-size:9px}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><strong>A-01 · LIVING WORLD</strong><span>Предварительная песочница цифровых жителей</span></div>
    <div class="tag">v0.1.1 · ОТДЕЛЬНАЯ ПЕСОЧНИЦА МОДУЛЯ</div>
  </header>
  <main class="stage">
    <div id="previewStage" aria-label="3D-предпросмотр"></div>
    <div class="help">Перетаскивай сцену мышью или пальцем. Кнопка «Живой мир» открывает управление спутниками.</div>
  </main>
</div>
<script src="./companion-motion.js" defer></script>
<script src="./companion-ai.js" defer></script>
<script src="./companions.js" defer></script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const host = document.getElementById("previewStage");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1723);
scene.fog = new THREE.Fog(0x0b1723, 10, 24);
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 80);
camera.position.set(6.4, 6.1, 8.4);
camera.lookAt(0, 2, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

scene.add(new THREE.HemisphereLight(0xcbe9ff, 0x26313a, 2.0));
const key = new THREE.DirectionalLight(0xffedce, 2.1);
key.position.set(4, 9, 5);
scene.add(key);
const fill = new THREE.PointLight(0x7c9cff, 20, 14);
fill.position.set(-3, 4, -2);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.CircleGeometry(3.72, 96), new THREE.MeshStandardMaterial({ color: 0x26353c, roughness: 0.82, metalness: 0.12 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = 1.99;
scene.add(floor);
const border = new THREE.Mesh(new THREE.TorusGeometry(3.72, 0.035, 8, 100), new THREE.MeshStandardMaterial({ color: 0x94c8d9, emissive: 0x28566a, emissiveIntensity: 0.8, metalness: 0.5, roughness: 0.35 }));
border.rotation.x = Math.PI / 2;
border.position.y = 2.02;
scene.add(border);

for (let i = 0; i < 12; i++) {
  const angle = i / 12 * Math.PI * 2;
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.08, 2.8, 10), new THREE.MeshStandardMaterial({ color: 0x668190, metalness: 0.65, roughness: 0.3 }));
  pillar.position.set(Math.cos(angle) * 3.45, 3.38, Math.sin(angle) * 3.45);
  scene.add(pillar);
}

window.EVA_SPHERE = { THREE: THREE, scene: scene, world: scene, camera: camera, controls: controls, renderer: renderer };
window.requestSceneRender = function () { renderer.render(scene, camera); };
window.dispatchEvent(new CustomEvent("eva-a01:scene-ready"));

function resize() {
  const width = host.clientWidth;
  const height = host.clientHeight;
  if (!width || !height) return;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
  renderer.render(scene, camera);
}
window.addEventListener("resize", resize);
resize();
renderer.setAnimationLoop(function () {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
